server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # File build có hash trong tên: cache lâu. index.html không cache để bản mới có hiệu lực ngay.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # CMS là ứng dụng một trang: đường dẫn nào không phải file thì trả index.html (vào thẳng /orders, /products... được)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
