# HFarm chạy bằng Docker: MySQL + backend + web CMS chỉ với `docker compose up -d --build`.
#
# - MySQL chạy RIÊNG trong container (dữ liệu nằm trong volume `hfarm-db`), KHÔNG dùng MySQL cài trên máy bạn
#   nên database `clothing_store` của bạn không bị đụng tới. Lần đầu khởi động, database trống được nạp từ database/schema.sql.
# - Mặc định là chế độ dev (AUTH_ENABLED=false, không cần Keycloak): CHỈ để chạy thử trên máy mình. Ở chế độ này ai gọi
#   được API cũng có quyền admin (header X-Dev-Role), nên đừng mở ra Internet.
# - Đổi cổng / mật khẩu: sao chép .env.example thành .env rồi sửa (xem README mục "Chạy bằng Docker").
name: hfarm

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-hfarm_docker_pw}
      # Để các file migration (không có lệnh USE) chạy trên đúng database này lúc khởi tạo
      MYSQL_DATABASE: clothing_store
    volumes:
      - hfarm-db:/var/lib/mysql
      # Chỉ chạy khi volume còn trống (lần đầu), theo thứ tự tên file. schema.sql tự tạo database clothing_store, bảng, size, màu,
      # danh mục; các migration thêm bảng thanh toán/giao hàng/banner (backend không khởi động nếu thiếu). Có migration mới thì thêm một dòng.
      # Volume ĐÃ có dữ liệu từ trước thì các file này không tự chạy: áp dụng tay (docs/RUNBOOK.md, mục Migration).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001_payment_shipping.sql:/docker-entrypoint-initdb.d/02-payment-shipping.sql:ro
      - ./database/migrations/002_banners.sql:/docker-entrypoint-initdb.d/03-banners.sql:ro
    ports:
      # 3307 để không đụng MySQL cài trên máy (3306). Dùng khi muốn mở Workbench vào MySQL trong Docker.
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-hfarm_docker_pw}
      DB_NAME: clothing_store
      # Địa chỉ công khai của API (dùng làm URL ảnh tải lên). Phải là địa chỉ mà trình duyệt / điện thoại truy cập được.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      DEV_ROLE: ${DEV_ROLE:-admin}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_ISSUERS: ${KEYCLOAK_ISSUERS:-}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DEFAULT_CARRIER: ${DEFAULT_CARRIER:-HFarm Express}
      # Thanh toán chuyển khoản VietQR: để trống BANK_* thì tắt chuyển khoản (app chỉ còn COD). Xem backend/.env.example
      BANK_BIN: ${BANK_BIN:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_ACCOUNT_NO: ${BANK_ACCOUNT_NO:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      PAYMENT_WEBHOOK_KEY: ${PAYMENT_WEBHOOK_KEY:-}
      PAYMENT_HOLD_MINUTES: ${PAYMENT_HOLD_MINUTES:-1440}
    volumes:
      - hfarm-uploads:/app/uploads
    ports:
      - "${API_PORT:-3100}:3000"

  web:
    build:
      context: ./web
      # Biến VITE_* được nhúng vào bản build: đổi xong phải build lại (docker compose up -d --build)
      args:
        VITE_API_URL: ${PUBLIC_URL:-http://localhost:3100}/api
        VITE_AUTH_DISABLED: ${VITE_AUTH_DISABLED:-true}
        VITE_DEV_ROLE: ${VITE_DEV_ROLE:-admin}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  hfarm-db:
  hfarm-uploads:
