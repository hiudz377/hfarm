# Theme đăng nhập HFarm: kế thừa theme mặc định keycloak.v2 (PatternFly 5), chỉ thêm CSS + logo + vài câu chữ.
# Không ghi đè file .ftl nào nên nâng cấp Keycloak không làm vỡ theme. Cách cài và chọn theme: docs/RUNBOOK.md mục 2.
parent=keycloak.v2

# CSS gốc của keycloak.v2 (giữ lại để bố cục form/alert không đổi) rồi tới CSS của HFarm
styles=css/styles.css css/hfarm.css

# Chỉ giao diện sáng, cùng tông với web CMS và app (keycloak.v2 mặc định đổi sang tối theo hệ điều hành)
darkMode=false

# Ngôn ngữ theme hỗ trợ (chỉ có tác dụng khi realm bật Internationalization)
locales=vi,en
